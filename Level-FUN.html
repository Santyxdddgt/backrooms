<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>BACKROOMS — LEVEL FUN =)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root { --ink: #101418; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Special Elite', 'Courier New', monospace;
    background: #f4fff8;
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    position: relative; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  /* confeti */
  .conf { position: absolute; top: -8vh; width: 10px; height: 16px; border-radius: 2px;
    animation: fall linear infinite; opacity: .85; }
  @keyframes fall { to { transform: translateY(118vh) rotate(720deg); } }
  /* globos */
  .balloon { position: absolute; width: 64px; height: 78px; border-radius: 50% 50% 48% 48%;
    animation: bob 5.2s ease-in-out infinite; opacity: .92; }
  .balloon::after { content: ''; position: absolute; left: 50%; bottom: -44px; width: 1.5px; height: 46px;
    background: rgba(16,20,24,.35); }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-16px) rotate(3deg); } }
  .wrap { position: relative; z-index: 2; text-align: center; padding: 28px; max-width: 34rem; }
  .kick { font-size: .8rem; letter-spacing: .38em; color: #5a6b78; margin-bottom: 1.1rem; }
  h1 { font-size: clamp(2.4rem, 11vw, 4.6rem); line-height: 1.04; letter-spacing: .02em;
    animation: hue 6s linear infinite; }
  h1 .l { display: inline-block; animation: hop 1.6s ease-in-out infinite; }
  @keyframes hop { 0%,100% { transform: translateY(0); } 30% { transform: translateY(-10px); } }
  @keyframes hue { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
  .sub { margin-top: 1.3rem; font-size: .95rem; line-height: 1.75; color: #33424e; }
  .sub b { color: #0d1216; }
  .eq { margin-top: 1.1rem; font-size: .78rem; letter-spacing: .16em; color: #6c7d89; }
  .cta { display: inline-block; margin-top: 2.1rem; padding: 1rem 1.9rem; text-decoration: none;
    font-size: .95rem; letter-spacing: .18em; color: #fff; border-radius: 3px;
    background: linear-gradient(180deg, #ff5f6d, #d63a56);
    box-shadow: 0 10px 26px rgba(214,58,86,.35), inset 0 1px 0 rgba(255,255,255,.35);
    animation: pulse 2.4s ease-in-out infinite; }
  .cta:active { transform: translateY(2px); }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.035); } }
  .foot { position: absolute; left: 0; right: 0; bottom: max(14px, env(safe-area-inset-bottom));
    text-align: center; font-size: .68rem; letter-spacing: .22em; color: #8a99a4; z-index: 2; }
</style>
</head>
<body>
<div class="wrap">
  <div class="kick">HAS LLEGADO AL</div>
  <h1 id="ttl"></h1>
  <div class="sub">
    La luz del tobogán te dejó aquí: pasillos de <b>confeti y papel picado</b>,
    globos atados al techo y una música que suena a cumpleaños lejano.<br>
    <b>LA FIESTA AÚN NO EMPEZÓ</b> — este nivel está <b>EN CONSTRUCCIÓN</b>.
  </div>
  <div class="eq" id="eq"></div>
  <a class="cta" id="goHub" href="#">▶ VOLVER AL HUB</a>
</div>
<div class="foot">BACKROOMS · LEVEL FUN · PRÓXIMAMENTE</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  /* título con letras de colores que saltan (estética Level FUN) */
  var cols = ['#ff5f6d', '#ff9f43', '#ffd93d', '#6bcB77', '#4d96ff', '#9b5de5'];
  var word = 'LEVEL FUN =)';
  document.getElementById('ttl').innerHTML = word.split('').map(function (ch, i) {
    if (ch === ' ') return ' ';
    return '<span class="l" style="color:' + cols[i % cols.length] + ';animation-delay:' + (i * 0.09) + 's">' + ch + '</span>';
  }).join('');
  /* stats heredadas del 37-2 */
  var lives = q.get('lives'), time = q.get('time'), from = q.get('from');
  var bits = [];
  if (lives !== null) bits.push('CINTAS: ' + lives);
  if (time !== null && time !== '0') bits.push('TIEMPO 37-2: ' + Math.floor(time / 60) + 'm ' + (time % 60) + 's');
  if (from) bits.push('PROCEDENTE DE: LEVEL ' + from.toUpperCase());
  document.getElementById('eq').textContent = bits.join(' · ');
  /* confeti procedural */
  for (var i = 0; i < 46; i++) {
    var c = document.createElement('i');
    c.className = 'conf';
    c.style.left = (Math.random() * 100) + 'vw';
    c.style.background = cols[i % cols.length];
    c.style.animationDuration = (3.6 + Math.random() * 4.2) + 's';
    c.style.animationDelay = (-Math.random() * 7) + 's';
    c.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)';
    if (i % 3 === 0) { c.style.borderRadius = '50%'; c.style.height = '10px'; }
    document.body.appendChild(c);
  }
  /* globos flotando a los costados */
  var bx = [6, 84, 14, 90];
  for (var b = 0; b < bx.length; b++) {
    var el = document.createElement('i');
    el.className = 'balloon';
    el.style.left = bx[b] + 'vw';
    el.style.top = (16 + (b % 2) * 26) + 'vh';
    el.style.background = 'radial-gradient(circle at 32% 28%, rgba(255,255,255,.75), ' + cols[(b + 2) % cols.length] + ' 62%)';
    el.style.animationDelay = (-b * 0.9) + 's';
    if (b > 1) { el.style.transform = 'scale(.62)'; el.style.opacity = '.6'; }
    document.body.appendChild(el);
  }
  /* volver al hub conservando las cintas */
  document.getElementById('goHub').addEventListener('click', function (e) {
    e.preventDefault();
    var p = new URLSearchParams();
    if (lives !== null) p.set('lives', lives);
    if (time !== null) p.set('time', time);
    p.set('shards', q.get('shards') || '0');
    window.location.replace('the-hub.html?' + p.toString());
  });
})();
</script>
</body>
</html>
